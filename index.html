const AuthContext = createContext({
  user: null,
  role: "guest",
  login: () => {},
  logout: () => {},
});

const useAuth = () => useContext(AuthContext);

const AuthManager = ({ children }) => {
  const [user, setUser] = useState(null);
  const [role, setRole] = useState("guest");

  const login = (u, r) => {
    setUser(u);
    setRole(r);
  };

  };

  return (
    <AuthContext.Provider value={{ user, role, login, logout }}>

};

const { User, Lock, Settings, Key, Sparkles, ArrowRight, Shield, Zap, Globe, Terminal, Play, Loader2, CheckCircle2, AlertCircle } = window;

const WorkflowPlayground = () => {
  const { useAuth } = window;

  const { role } = useAuth();
  const [prompt, setPrompt] = useState("Analyze secure vector embeddings sequence...");
  const [output, setOutput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const runWorkflow = async () => {
    if (role === 'guest') {
      setError("Insufficient Role: Requires active authentication.");
      setTimeout(() => setError(""), 3000);
      return;
    }

    setLoading(true);
    setError("");
    try {
      const res = await fetch("/api/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tool: 'paraphraser', text: prompt })
      });
      const data = await res.json();
      if (data.result) {
        setOutput(data.result);
      } else {
        setError(data.error || "Node Execution Fault.");
      }
    } catch (e) {
      setError("API Gateway Disconnected.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="relative py-24 w-full max-w-6xl mx-auto px-6">
      <div className="text-center mb-16">
        <h2 className="text-3xl md:text-4xl font-heading font-bold text-white mb-3 tracking-tight">Dynamic Framework Execution</h2>
        <p className="text-slate-400 max-w-lg mx-auto text-sm font-light leading-relaxed">Connect dynamically to the Genkit architecture. Select specialized roles in the top right corner to bypass simulated gateway locks.</p>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

              <Terminal className="w-4 h-4 text-primary" /> Instance Shell
            </div>
            <div className={`text-[10px] font-bold tracking-wider border px-2 py-1 rounded-lg uppercase ${role === 'guest' ? 'text-red-400 border-red-500/20 bg-red-500/5' : 'text-emerald-400 border-emerald-500/20 bg-emerald-500/5'}`}>
              Role: {role}
            </div>
          </div>

          <textarea 
            value={prompt}
            onChange={(e) => setPrompt(e.target.value)}
            className="w-full h-48 bg-black/40 rounded-2xl p-5 text-slate-200 font-mono text-sm border border-white/5 focus:border-primary/40 focus:outline-none resize-none placeholder-slate-600 transition-colors"
          />

          <motion.button
            whileTap={{ scale: 0.98 }}
            onClick={runWorkflow}

            className="mt-6 w-full py-4 flex items-center justify-center gap-3 bg-gradient-to-br from-indigo-600 to-violet-700 hover:brightness-110 disabled:opacity-40 text-white text-sm font-bold tracking-wide rounded-2xl shadow-lg shadow-indigo-900/20 transition-all"
          >
            {loading ? <Loader2 className="w-5 h-5 animate-spin" /> : <Play className="w-4 h-4 fill-current" />}
            Initialize Stream Matrix
          </motion.button>

          {error && (
            <motion.div

           window.createContext = window.React.createContext;
           window.useContext = window.React.useContext;
           window.createRoot = window.ReactDOM.createRoot;
           
           // Motion detection (varies slightly between versions)
           window.motion = window.Motion || window.framerMotion?.motion || window.framerMotion;
           window.AnimatePresence = window.Motion?.AnimatePresence || window.framerMotion?.AnimatePresence;
           
           console.log("[LOADER] Starting manual compilation pipeline...");
           if (typeof Babel === 'undefined') {
               throw new Error("Babel Standalone was blocked or failed to load.");
           }
           
           const rawCode = document.getElementById('source-payload').textContent;
           
           console.log("[LOADER] Parsing source via Babel Core...");
           // Perform manual transformation!
           const result = Babel.transform(rawCode, {
               presets: ['react'],
               filename: 'app.jsx' // Hint to Babel that this is JSX code
           });
           
           console.log("[LOADER] Compilation finished. Injecting execution...");
           
           // We execute the code dynamically now!
           const execScript = document.createElement('script');
           execScript.text = result.code;
           document.body.appendChild(execScript);
           
           console.log("[LOADER] Script active. Checking for React Initialization vector...");
           
           if (typeof window.__INIT_REACT_NOW__ === 'function') {
               window.__INIT_REACT_NOW__();
           } else {
               throw new Error("Boot sequence handler missing after execution.");
           }
       } catch (e) {
           console.error("[LOADER] COMPILER FAULT:", e);
           document.getElementById('fallback-loader').innerText = "COMPILE ERROR: " + e.message;
           document.getElementById('fallback-loader').style.color = 'red';
       }
    });
  </script>
</body>
</html>
